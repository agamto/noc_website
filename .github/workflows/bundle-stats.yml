name: Bundle Stats

on:
  workflow_dispatch:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

permissions:
  contents: write
  pull-requests: write
  actions: read

jobs:
  compare:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Check for main branch stats artifact
        id: check-main-stats
        if: ${{ github.event_name == 'pull_request' }}
        env:
          GH_TOKEN: ${{ github.token }}
          ARTIFACT_NAME: main-branch-stats
        run: |
          artifact_count=$(gh api \
            "/repos/${GITHUB_REPOSITORY}/actions/artifacts?name=${ARTIFACT_NAME}&per_page=100" \
            --jq '[.artifacts[] | select(.name == env.ARTIFACT_NAME and .expired == false)] | length')

          if [ "$artifact_count" -gt 0 ]; then
            echo "available=true" >> "$GITHUB_OUTPUT"
          else
            echo "available=false" >> "$GITHUB_OUTPUT"
            echo "::warning title=Bundle size skipped::The main branch stats artifact is missing or expired."
          fi

      - name: Compare bundle size
        if: ${{ github.event_name != 'pull_request' || steps.check-main-stats.outputs.available == 'true' }}
        uses: grafana/plugin-actions/bundle-size@main # zizmor: ignore[unpinned-uses] provided by grafana
